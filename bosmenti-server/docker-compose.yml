# The whole shop on one server: database, app, and Caddy for HTTPS.
# Fill in .env (copy .env.example), then:  docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bosmenti
      POSTGRES_USER: bosmenti
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env faylida DB_PASSWORD yozilmagan}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bosmenti -d bosmenti"]
      interval: 5s
      retries: 12

  app:
    build:
      context: ..
      dockerfile: bosmenti-server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bosmenti:${DB_PASSWORD}@db:5432/bosmenti
      ADMIN_LOGIN: ${ADMIN_LOGIN:?.env faylida ADMIN_LOGIN yozilmagan}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?.env faylida ADMIN_PASSWORD yozilmagan}
      PUBLIC_URL: https://${DOMAIN}
      TRUST_PROXY: 1
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SEED_DEMO_PRODUCTS: ${SEED_DEMO_PRODUCTS:-true}
    volumes:
      - uploads:/app/uploads

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?.env faylida DOMAIN yozilmagan}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
